  .bl-root{min-height:100vh;background:#0a0c18;background-image:radial-gradient(circle at 20% 0%,#141a3a 0%,transparent 50%),radial-gradient(circle at 90% 90%,#131029 0%,transparent 45%);color:#dfe4ff;font-family:ui-sans-serif,system-ui,sans-serif;padding:18px 14px 60px}

  .bl-token.P{border-color:#5ad0ff;background:rgba(20,80,140,.55)}
  .bl-token.E{border-color:#ff6b81;background:rgba(140,25,50,.55)}
  .bl-token.sel{box-shadow:0 0 0 3px #f2cc60,0 0 18px rgba(242,204,96,.5);z-index:4}
  .bl-token .ic{font-size:26px;line-height:1}
  .bl-hpbar{width:80%;height:5px;background:#111;border-radius:3px;margin-top:2px;overflow:hidden}
  .bl-hpbar>div{height:100%;background:linear-gradient(90deg,#41e07d,#a5f24a)}
  .bl-appips{display:flex;gap:1px;margin-top:1px}
  .bl-appips i{width:5px;height:5px;border-radius:50%;background:#3a4aa8;display:block}
  .bl-appips i.on{background:#f2cc60}
  .bl-face{position:absolute;width:0;height:0;border:5px solid transparent;z-index:5}
  .bl-lab{font-size:10px;color:#6b74b0;letter-spacing:.1em}
  .bl-log{max-height:420px;overflow-y:auto;font-size:12.5px;line-height:1.55}
  .bl-log .round{color:#f2cc60;font-weight:800;letter-spacing:.1em;margin-top:6px}
  .bl-log .hit{color:#ffd2d2}
  .bl-log .heal{color:#b6f7c2}
  .bl-log .warn{color:#9aa3d8;font-style:italic}
  .bl-log .death{color:#ff6b81;font-weight:700}
  .bl-log .charge{color:#d6a9ff;font-weight:700}
  .bl-chip{display:inline-block;padding:2px 8px;border-radius:10px;border:1px solid #4a5ac0;background:#0d1450;font-size:11px;margin:2px}
  .bl-chip.on{border-color:#f2cc60;color:#f2cc60}
  .bl-list-item{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:6px;border:1.5px solid transparent;cursor:pointer}
  .bl-list-item:hover{background:rgba(255,255,255,.05)}
  .bl-list-item.on{border-color:#f2cc60;background:rgba(242,204,96,.08)}
  .bl-overlay{position:absolute;box-sizing:border-box;z-index:2;pointer-events:none}
  .bl-note{font-size:11.5px;color:#9aa3d8;line-height:1.5}
  textarea.bl-json{width:100%;height:160px;background:#060a24;color:#cfe;border:1.5px solid #4a5ac0;border-radius:6px;font-family:ui-monospace,monospace;font-size:11px;padding:8px;box-sizing:border-box}
  .bl-statbox{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  @media(max-width:700px){.bl-grid-wrap{flex-direction:column}}
