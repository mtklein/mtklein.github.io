<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#141b29">
<title>October Sunrise — One Shot</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#141b29;color:#f6ecdb}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{display:flex;justify-content:center;touch-action:none}
.shell{width:min(100%,540px);height:100%;height:100dvh;display:flex;flex-direction:column;background:#1d2636;box-shadow:0 0 60px #080e19}
.top{height:42px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#111926;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#e6bea2}
.top span:last-child{opacity:.65}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#23314a}
canvas{width:100%;height:100%;display:block}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#101929b8;text-align:center}
.overlay[hidden]{display:none}
.card{max-width:340px;padding:28px 22px;background:#182334ee;border:1px solid #e6bea270;border-radius:6px;box-shadow:0 15px 45px #070d1b80}
.eyebrow{font-size:10px;letter-spacing:.25em;color:#ebb695;text-transform:uppercase}
h1{font-family:Georgia,serif;font-weight:400;font-size:32px;line-height:1.12;margin:12px 0;color:#fff0db}
p{font-size:14px;line-height:1.5;color:#d5d5d8}
.cta{margin-top:10px;border:1px solid #f5c1a2;background:#a34842;color:#fff9ec;border-radius:4px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer}
.hint{position:absolute;left:12px;right:12px;bottom:14px;text-align:center;font-size:12px;text-shadow:0 2px 5px #08101d;pointer-events:none;color:#fff1de}
.controller{flex:none;height:clamp(206px,36dvh,285px);padding:12px 17px max(14px,env(safe-area-inset-bottom));background:linear-gradient(150deg,#d5d3cc,#aaa9a4);color:#292b32;border-top:7px solid #363b43;display:flex;flex-direction:column;justify-content:space-between;user-select:none;-webkit-user-select:none}
.brand{font-weight:900;letter-spacing:.2em;color:#9c353d;font-style:italic;font-size:13px}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;gap:4px;min-height:132px}
.dpad{width:126px;height:126px;position:relative;justify-self:start}
.key{position:absolute;border:0;background:#292d34;color:#ddd;touch-action:none;cursor:pointer;font-weight:700;box-shadow:inset 0 -3px #171b20,0 3px 2px #777}
.key:active,.key.pressed{background:#4b5360;transform:translateY(2px);box-shadow:inset 0 -1px #171b20}
.dir{width:42px;height:42px;font-size:17px}.up{left:42px;top:0;border-radius:4px 4px 0 0}.down{left:42px;top:84px;border-radius:0 0 4px 4px}.left{left:0;top:42px;border-radius:4px 0 0 4px}.right{left:84px;top:42px;border-radius:0 4px 4px 0}
.cross{position:absolute;left:42px;top:42px;width:42px;height:42px;background:#292d34}
.mid{display:flex;justify-content:center;align-items:end;gap:9px;align-self:stretch;padding-bottom:5px}
.small-control{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:9px;font-weight:700;letter-spacing:.08em}
.pill{position:static;width:40px;height:15px;border-radius:12px;transform:rotate(-25deg)}
.pill:active,.pill.pressed{transform:rotate(-25deg) translateY(2px)}
.face{display:flex;justify-content:flex-end;gap:11px;align-items:center}
.face-control{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;font-weight:800}
.round{position:static;width:54px;height:54px;border-radius:50%;background:#a23846;color:#fff7e9;font-size:17px;box-shadow:inset 0 -4px #702631,0 4px 2px #777}
.round:active,.round.pressed{background:#c9525b;box-shadow:inset 0 -1px #702631}
.footer{font-size:10px;text-align:center;color:#62646a;letter-spacing:.04em}
@media(max-width:375px){.controller{padding-left:10px;padding-right:10px}.dpad{transform:scale(.86);transform-origin:left center}.round{width:47px;height:47px}.controls{gap:0}.face{gap:5px}}
@media(min-width:700px){.shell{border-left:1px solid #566070;border-right:1px solid #566070}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><span>ONE SHOT / 001</span><span>October Sunrise</span></header>
<section class="stage" aria-label="October Sunrise game">
<canvas id="game" aria-label="Autumn landscape with a path toward the sunrise"></canvas>
<div class="hint" id="hint" aria-live="polite"></div>
<div class="overlay" id="overlay">
<div class="card"><div class="eyebrow" id="eyebrow">A small experience</div><h1 id="title">October Sunrise</h1><p id="message">Walk east through the falling leaves. Stop at the overlook and let the morning arrive.</p><button class="cta" id="continue">Begin</button></div>
</div>
</section>
<section class="controller" aria-label="Game controller">
<div class="brand">ONE SHOT</div>
<div class="controls">
<div class="dpad" aria-label="Directional pad"><div class="cross"></div><button class="key dir up" data-key="up" aria-label="Up">▲</button><button class="key dir down" data-key="down" aria-label="Down">▼</button><button class="key dir left" data-key="left" aria-label="Left">◀</button><button class="key dir right" data-key="right" aria-label="Right">▶</button></div>
<div class="mid"><div class="small-control"><button class="key pill" data-key="select" aria-label="Select"></button><span>SELECT</span></div><div class="small-control"><button class="key pill" data-key="start" aria-label="Start"></button><span>START</span></div></div>
<div class="face"><div class="face-control"><button class="key round" data-key="b" aria-label="B">B</button><span>B</span></div><div class="face-control"><button class="key round" data-key="a" aria-label="A">A</button><span>A</span></div></div>
</div><div class="footer">D-PAD MOVE · B HURRY · A PAUSE &amp; LISTEN · START MENU · SELECT RESTART</div>
</section>
</main>
<script type="module">
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
const overlay=document.querySelector('#overlay'),hint=document.querySelector('#hint');
const buttons=[...document.querySelectorAll('[data-key]')],held=new Set();
let scene,mode='intro',last=0,w=0,h=0,dpr=1;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
new ResizeObserver(resize).observe(canvas);
function show(eyebrow,title,message,button){document.querySelector('#eyebrow').textContent=eyebrow;document.querySelector('#title').textContent=title;document.querySelector('#message').textContent=message;document.querySelector('#continue').textContent=button;overlay.hidden=false}
function begin(){scene=OctoberSunrise();mode='playing';overlay.hidden=true}
document.querySelector('#continue').addEventListener('click',()=>{if(mode==='finished'||mode==='intro')begin();else{mode='playing';overlay.hidden=true}});
function press(key){if(key==='select'){begin();return}if(key==='start'){if(mode==='playing'){mode='paused';show('A moment held','Paused','The light will wait for you.','Continue')}else if(mode==='paused'){mode='playing';overlay.hidden=true}else if(mode==='intro'||mode==='finished')begin();return}if(mode==='intro'&&key==='a'){begin();return}if(mode==='finished'&&key==='a'){begin();return}held.add(key)}
function release(key){held.delete(key)}
for(const button of buttons){let id=null;button.addEventListener('pointerdown',e=>{e.preventDefault();button.setPointerCapture(e.pointerId);id=e.pointerId;button.classList.add('pressed');press(button.dataset.key)});const up=e=>{if(id!==e.pointerId)return;id=null;button.classList.remove('pressed');release(button.dataset.key)};button.addEventListener('pointerup',up);button.addEventListener('pointercancel',up);button.addEventListener('lostpointercapture',()=>{id=null;button.classList.remove('pressed');release(button.dataset.key)})}
const keys={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',z:'b',x:'a',Enter:'start',Shift:'select'};
addEventListener('keydown',e=>{const k=keys[e.key];if(!k)return;e.preventDefault();if(!e.repeat)press(k)});
addEventListener('keyup',e=>{const k=keys[e.key];if(k){e.preventDefault();release(k)}});
addEventListener('blur',()=>held.clear());
function hill(y,amp,color,phase){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,h);ctx.lineTo(0,y);for(let x=0;x<=w+8;x+=8)ctx.lineTo(x,y+Math.sin(x/w*7+phase)*amp+Math.sin(x/w*14+phase)*amp*.23);ctx.lineTo(w,h);ctx.fill()}
function tree(x,y,size,seed,near){ctx.save();ctx.translate(x,y);ctx.fillStyle=near?'#352d36':'#55404a';ctx.fillRect(-size*.055,-size*.18,size*.11,size*.75);const colors=near?['#b55a42','#cf7544','#d39550','#855044']:['#855360','#ad6956','#c08359'];for(let i=0;i<9;i++){const a=i*2.4+seed,dist=size*(.13+(i%4)*.055);ctx.fillStyle=colors[(i+seed)%colors.length|0];ctx.beginPath();ctx.ellipse(Math.cos(a)*dist,-size*.4+Math.sin(a)*dist*.7,size*(.16+(i%3)*.025),size*.14,a,0,7);ctx.fill()}ctx.restore()}
function OctoberSunrise(){
 // Each experience owns its state and update/draw methods; the shared shell owns inputs and time.
 const s={time:0,x:.08,y:.55,still:0,light:0,done:false,leaves:Array.from({length:32},(_,i)=>({x:(i*71%101)/101,y:(i*37%97)/97,phase:i*2.31,speed:.025+(i%6)*.007}))};
 s.update=(dt,input)=>{
 s.time+=dt;
 const dx=Number(input.has('right'))-Number(input.has('left')),dy=Number(input.has('down'))-Number(input.has('up'));
 const moving=!!(dx||dy),speed=input.has('b')?.24:.13;
 s.x=clamp(s.x+dx*speed*dt,.04,.96);s.y=clamp(s.y+dy*speed*dt,.28,.78);
 const atOverlook=s.x>.79&&s.y<.66;
 s.still=atOverlook&&!moving&&input.has('a')?s.still+dt:Math.max(0,s.still-dt*.6);
 s.light=clamp(s.light+dt*(atOverlook?.024:.009),0,1);
 if(s.still>4&&!s.done){s.done=true;mode='finished';show('The morning is yours','The day begins','For a few minutes, you were exactly where you needed to be.','Walk again')}
 hint.textContent=atOverlook?'Hold A and watch the light':s.x<.45?'Follow the path east →':'The overlook is just ahead →';
 };
 s.draw=()=>{
 const glow=clamp(s.light+s.still*.1,0,1);
 const sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#27334f');sky.addColorStop(.52,glow>.45?'#c47965':'#9b6671');sky.addColorStop(1,'#edaa71');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);
 const sx=w*.82,sy=h*(.55-glow*.13);const halo=ctx.createRadialGradient(sx,sy,2,sx,sy,w*.6);halo.addColorStop(0,'#ffe7a4bb');halo.addColorStop(.35,'#efaa7977');halo.addColorStop(1,'#efaa7900');ctx.fillStyle=halo;ctx.fillRect(0,0,w,h);
 ctx.fillStyle='#ffe5ae';ctx.beginPath();ctx.arc(sx,sy,w*.083,0,7);ctx.fill();
 hill(h*.59,15,'#675669',.8);hill(h*.68,17,'#514a5c',2.5);
 for(let i=0;i<8;i++)tree((i/7)*w,h*.69+Math.sin(i*2)*12,35+(i%3)*10,i,false);
 ctx.fillStyle='#473c4b';ctx.fillRect(0,h*.75,w,h*.25);
 ctx.fillStyle='#a08a7c';ctx.beginPath();ctx.moveTo(0,h);ctx.bezierCurveTo(w*.43,h*.91,w*.47,h*.76,w*.88,h*.7);ctx.lineTo(w*.87,h*.68);ctx.bezierCurveTo(w*.41,h*.74,w*.3,h*.9,-w*.2,h);ctx.fill();
 for(let i=0;i<5;i++)tree((i*.29-.07)*w,h*.89+(i%2)*h*.07,65+(i%3)*19,i+5,true);
 for(const leaf of s.leaves){const x=((leaf.x+s.time*leaf.speed)%1.1)*w,y=((leaf.y+s.time*.06)%1.1)*h;ctx.fillStyle=['#dba16b','#b8614a','#e8bf81'][Math.floor(leaf.phase)%3];ctx.save();ctx.translate(x+Math.sin(s.time*2+leaf.phase)*9,y);ctx.rotate(s.time+leaf.phase);ctx.fillRect(-3,-1,6,2);ctx.restore()}
 const px=lerp(w*.12,w*.86,s.x),py=h*(.84+(s.y-.55)*.23)-Math.sin(s.x*Math.PI)*h*.1;
 ctx.fillStyle='#1d2535';ctx.beginPath();ctx.ellipse(px,py+10,9,3,0,0,7);ctx.fill();ctx.fillRect(px-5,py-12,10,19);ctx.beginPath();ctx.arc(px,py-16,6,0,7);ctx.fill();ctx.fillStyle='#ca7350';ctx.fillRect(px-5,py-10,10,4);
 if(s.still>0){ctx.fillStyle='#fce8be';ctx.font='14px Georgia';ctx.textAlign='center';ctx.fillText('Breathe in the morning',w/2,h*.19)}
 };
 return s;
}
function frame(t){const dt=Math.min((t-last)/1000||0,.05);last=t;if(w&&h){if(mode==='playing')scene.update(dt,held);if(!scene)scene=OctoberSunrise();scene.draw()}requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
</body>
</html>
